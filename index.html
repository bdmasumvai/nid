<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NID Generator Pro | Masum Vai</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<nav class="navbar">
    <div class="logo">Smart ID Generator</div>
    <div class="channel-name">@Masum_Tech_Sensei</div>
</nav>

<div class="container">
    <div class="form-wrapper">
        <div class="card-header-title">তথ্য প্রদান করুন</div>
        <div class="grid-inputs">
            <input type="text" id="inName" placeholder="নাম (বাংলায়)">
            <input type="text" id="inEng" placeholder="Name (English)">
            <input type="text" id="inFather" placeholder="পিতার নাম">
            <input type="text" id="inMother" placeholder="মাতার নাম">
            <input type="text" id="inDOB" placeholder="জন্ম তারিখ">
            <input type="text" id="inID" placeholder="ID NO">
        </div>

        <div class="upload-group">
            <label>👤 প্রোফাইল ছবি</label>
            <input type="file" accept="image/*" onchange="previewImg(event, 'cardPhoto')">
        </div>

        <div class="sig-group">
            <label>✍️ ডিজিটাল স্বাক্ষর দিন</label>
            <canvas id="sig-pad" width="300" height="100"></canvas>
            <button class="btn-clear" onclick="clearSig()">মুছুন</button>
        </div>

        <div class="action-buttons">
            <button class="btn-primary" onclick="updateCard()">কার্ড জেনারেট করুন</button>
            <button class="btn-success" onclick="download()">ডাউনলোড করুন</button>
        </div>
    </div>

    <div class="preview-wrapper">
        <div class="card-header-title">লাইভ প্রিভিউ</div>
        <div id="nidCard" class="nid-main-card">
            <div class="card-content-flex">
                <div class="left-side">
                    <div class="photo-container">
                        <img id="cardPhoto" src="" alt="">
                    </div>
                    <div class="signature-container">
                        <img id="cardSig" src="" alt="">
                    </div>
                </div>

                <div class="right-side">
                    <p><span class="label">নাম:</span> <span id="outName" class="val-bn"></span></p>
                    <p><span class="label">Name:</span> <span id="outEng" class="val-en"></span></p>
                    <p><span class="label">পিতা:</span> <span id="outFather"></span></p>
                    <p><span class="label">মাতা:</span> <span id="outMother"></span></p>
                    <p><span class="label red">Date of Birth:</span> <span id="outDOB" class="val-red"></span></p>
                    <p><span class="label red">ID NO:</span> <span id="outID" class="val-red id-bold"></span></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
